<!doctype html>
<html lang="en">
  <head>
    <title>Your bank</title>
  </head>
  <body>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f4f6f8;
        padding: 10px;
      }

      h2 {
        color: #1f2937;
        margin-bottom: 10px;
      }
      h3 {
        font-size: 12px;
        font-style: italic;
        margin-bottom: 10px;
      }
      .account-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
      }

      .account-grid p {
        margin: 0;
        padding: 16px;
        background: white;
        border-radius: 8px;
        border-left: 4px solid #2563eb;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        color: #374151;
        font-size: 12px;
      }

      #balance {
        font-size: 1.2rem;
        font-weight: bold;
        color: #0f766e;
      }

      #status {
        font-weight: bold;
      }

      label {
        display: block;
        margin-top: 10px;
        margin-bottom: 3px;
        font-weight: bold;
        color: #374151;
      }

      #amountInput {
        width: 200px;
        padding: 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        margin-bottom: 15px;
      }

      button {
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        margin-right: 10px;
      }

      #depositButton {
        background-color: #16a34a;
      }

      #depositButton:hover {
        background-color: #15803d;
      }

      #withdrawButton {
        background-color: #dc2626;
      }

      #withdrawButton:hover {
        background-color: #b91c1c;
      }

      .card-label {
        display: block;
        font-size: 10px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #6b7280;
        margin-bottom: 6px;
      }

      .card-value {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #1f2937;
      }

      .balance-value {
        font-size: 24px;
        color: #0f766e;
      }
    </style>
    <h2>Customer Account</h2>
    <div class="account-grid">
      <p id="customer"></p>
      <p id="account"></p>
      <p id="accountType"></p>
      <p id="balance"></p>
    </div>
    <h3 id="status"></h3>
    <button id="depositButton">Deposit</button>
    <button id="withdrawButton">Withdraw</button>
    <label>Transaction Amount:</label>
    <input id="amountInput" type="number" />
    <h3>Transaction History</h3>
    <ul id="transactionList"></ul>
    <script src="bank.js"></script>
  </body>
</html>
